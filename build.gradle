plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

base { archivesName = 'CapitalMC' }

repositories {
    maven { url = 'https://maven.nucleoid.xyz/' }
    flatDir { dirs 'libs' }
}

loom {
    serverOnlyMinecraftJar()
    runs {
        server {
            server()
            runDir 'run'
        }
    }
}

fabricApi.configureTests {
    createSourceSet = true
    modId = 'capitalmc_test'
    enableClientGameTests = false
}
loom.runs.gameTest {
    property 'fabric-api.gametest.report-file', '../../reports/gametest.xml'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "eu.pb4:sgui:${sgui_version}"
    include "eu.pb4:sgui:${sgui_version}"
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'nhcm:advmatch:1.1.0'
    include 'nhcm:advmatch:1.1.0'

    compileOnly("org.projectlombok:lombok:1.18.48")
    annotationProcessor("org.projectlombok:lombok:1.18.48")

    testCompileOnly("org.projectlombok:lombok:1.18.48")
    testAnnotationProcessor("org.projectlombok:lombok:1.18.48")
}

test {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    workingDir layout.buildDirectory.dir('test-runtime').get().asFile
    doFirst { workingDir.mkdirs() }
}

processResources {
    def modVersion = project.version
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') { expand version: modVersion }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

publishing {
    publications {
        mavenJava(MavenPublication) { from components.java }
    }
}
